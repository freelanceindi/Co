<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hire Editor | EditHub India</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<header class="navbar">

<div class="logo">
EditHub <span>India</span>
</div>

<nav>

<a href="index.html">Home</a>
<a href="explore.html">Explore</a>
<a href="dashboard.html">Dashboard</a>

</nav>

</header>

<section class="section">

<div class="container">

<h1>Hire a Video Editor</h1>

<p>Fill out your project details and send a hire request.</p>

<form id="hireForm">

<div class="form-group">

<label>Project Title</label>

<input
type="text"
id="title"
required>

</div>

<div class="form-group">

<label>Project Description</label>

<textarea
id="description"
rows="6"
required></textarea>

</div>

<div class="form-group">

<label>Budget (₹)</label>

<input
type="number"
id="budget"
required>

</div>

<div class="form-group">

<label>Deadline</label>

<input
type="date"
id="deadline">

</div>

<div class="form-group">

<label>Reference Link</label>

<input
type="url"
id="reference">

</div>

<div class="form-group">

<label>Upload Footage</label>

<input
type="file"
multiple>

</div>

<button
class="btn-primary"
type="submit">

Send Hire Request

</button>

</form>

</div>

</section>

<script src="js/hire.js"></script>

</body>
</html>
