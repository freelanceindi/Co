<main>

<!-- Cover -->

<section class="profile-cover">

<img id="coverImage"
src="https://picsum.photos/1400/350"
alt="Cover">

</section>

<!-- Profile -->

<section class="section">

<div class="container">

<div class="profile-header">

<img
id="profileAvatar"
class="profile-avatar"
src="https://i.pravatar.cc/180?img=12"
alt="Avatar">

<div class="profile-info">

<h1 id="profileName">
Loading...
</h1>

<p id="profileCity">
Mumbai, India
</p>

<span class="available-badge">
🟢 Available for Work
</span>

<p id="profileBio"></p>

<div class="profile-buttons">

<button class="btn-primary">
Hire Now
</button>

<button class="btn-secondary">
Message
</button>

<button class="btn-secondary">
Follow
</button>

</div>

</div>

</div>

</div>

</section>

<!-- Details -->

<section class="section">

<div class="container">

<div class="grid">

<div class="card">

<h3>Pricing</h3>

<p id="profilePrice"></p>

</div>

<div class="card">

<h3>Experience</h3>

<p id="profileExperience"></p>

</div>

<div class="card">

<h3>Rating</h3>

<p id="profileRating"></p>

</div>

<div class="card">

<h3>Followers</h3>

<p id="profileFollowers"></p>

</div>

</div>

</div>

</section>

<!-- Software -->

<section class="section">

<div class="container">

<h2 class="section-title">

Software

</h2>

<div id="softwareList" class="skills-grid">

</div>

</div>

</section>

<!-- Portfolio -->

<section class="section">

<div class="container">

<h2 class="section-title">

Portfolio

</h2>

<div class="grid" id="portfolioGrid">

</div>

</div>

</section>

<!-- Reviews -->

<section class="section">

<div class="container">

<h2 class="section-title">

Reviews

</h2>

<div class="grid">

<div class="card">

★★★★★

<p>

Amazing editor with fast delivery.

</p>

<strong>

Rahul

</strong>

</div>

<div class="card">

★★★★★

<p>

Professional quality work.

</p>

<strong>

Anjali

</strong>

</div>

</div>

</div>
