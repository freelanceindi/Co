<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | EditHub India</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/bottom-navigation.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/explore.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/dashboard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header class="navbar">

<a href="index.html" class="logo">
EditHub <span>India</span>
</a>

<nav>

<a href="index.html">Home</a>
<a href="explore.html">Explore</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>

<a href="login.html" class="btn-primary">
Login
</a>

</nav>

</header>

<main>

<section class="section">

<div class="container">

<div class="auth-card">

<h1>Become an Editor 🚀</h1>

<p>Create your professional profile and start getting hired.</p>

<form id="registerForm">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Your Full Name"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="example@email.com"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Minimum 8 characters"
required>

</div>

<div class="form-group">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

<div class="form-group">

<label>Editing Category</label>

<select id="category">

<option>YouTube</option>
<option>Instagram Reels</option>
<option>Wedding</option>
<option>Commercial</option>
<option>Gaming</option>
<option>Motion Graphics</option>
<option>Podcast</option>

</select>

</div>

<div class="form-group">

<label>Experience</label>

<select id="experience">

<option>Beginner (0-1 Year)</option>
<option>Intermediate (2-4 Years)</option>
<option>Professional (5+ Years)</option>

</select>

</div>

<div class="form-group">

<label>Portfolio Link</label>

<input
type="url"
placeholder="https://yourportfolio.com">

</div>

<div class="form-group">

<label>Upload Profile Image</label>

<input
type="file"
accept="image/*">

</div>

<button
type="submit"
class="btn-primary auth-btn">

Create Account

</button>

<p class="auth-switch">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</div>

</section>

</main>

<footer>

<div class="container">

<p>

© 2026 EditHub India

</p>

</div>

</footer>

<nav class="bottom-nav">

<a href="index.html">🏠</a>

<a href="explore.html">🔍</a>

<a href="saved.html">❤️</a>

<a href="messages.html">💬</a>

<a href="profile.html">👤</a>

</nav>

<script src="js/auth.js"></script>

</body>

</html>
