<body>

<header class="navbar">

<a href="index.html" class="logo">
EditHub <span>India</span>
</a>

<nav>

<a href="index.html">Home</a>
<a href="explore.html">Explore</a>
<a href="contact.html">Contact</a>

<a href="profile.html" class="btn-primary">
Profile
</a>

</nav>

</header>

<main>

<section class="section">

<div class="container">

<h1 class="section-title">
Settings
</h1>

<p class="section-subtitle">
Manage your account preferences.
</p>

<div class="settings-wrapper">

<!-- Profile Settings -->

<div class="card">

<h3>Profile Settings</h3>

<div class="form-group">

<label>Display Name</label>

<input
type="text"
value="Harsh">

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
value="harsh@example.com">

</div>

<button class="btn-primary">
Save Changes
</button>

</div>

<!-- Password -->

<div class="card">

<h3>Change Password</h3>

<div class="form-group">

<input
type="password"
placeholder="Current Password">

</div>

<div class="form-group">

<input
type="password"
placeholder="New Password">

</div>

<button class="btn-primary">

Update Password

</button>

</div>

<!-- Notifications -->

<div class="card">

<h3>Notifications</h3>

<label class="switch-row">

<span>Email Notifications</span>

<input type="checkbox" checked>

</label>

<label class="switch-row">

<span>Hire Requests</span>

<input type="checkbox" checked>

</label>

<label class="switch-row">

<span>Messages</span>

<input type="checkbox" checked>

</label>

</div>

<!-- Theme -->

<div class="card">

<h3>Appearance</h3>

<label class="switch-row">

<span>Dark Mode</span>

<input
type="checkbox"
checked
id="themeToggle">

</label>

</div>

<!-- Danger Zone -->

<div class="card danger-card">

<h3>Delete Account</h3>

<p>
This action cannot be undone.
</p>

<button class="btn-danger">

Delete Account

</button>

</div>

</div>

</div>

</section>

</main>

<footer>

<div class="container">

<p>

</div>
